let lang     = localStorage.getItem("lang") || "ko";
let db       = null;

// ─── i18n helper ─────────────────────────────────────────────────────────────
const t = k => LANG[lang][k] || k;

// ─── Firebase init ───────────────────────────────────────────────────────────
function initFirebase() {
  if (FIREBASE_CONFIG.apiKey === "YOUR_API_KEY") {
    showToast(t("firebaseNotSet"), "warn");
    showToast(t("offline"), "info");
    return false;
  }
  try {
    const app = initializeApp(FIREBASE_CONFIG);
    db = getDatabase(app);
    document.getElementById("connStatus").textContent = "● " + t("connecting");
    onValue(ref(db, "team"), snap => {
      teamData = snap.val() || {};
      renderAll();
      document.getElementById("connStatus").textContent = "● " + t("connected");
      document.getElementById("connStatus").style.color = "#43a047";
    });
    return true;
  } catch(e) {
    console.error(e);
    showToast(t("offline"), "warn");
    return false;
  }
}

// ─── localStorage fallback ───────────────────────────────────────────────────
function loadLocal() {
  try { teamData = JSON.parse(localStorage.getItem("teamData") || "{}"); } catch(e) { teamData = {}; }
  renderAll();
}
function saveLocal() {
  localStorage.setItem("teamData", JSON.stringify(teamData));
}

// ─── Write helpers ────────────────────────────────────────────────────────────
async function writeUser(patch) {
  if (!myId) return;
  if (db) {
    await update(ref(db, `team/${myId}`), patch);
  } else {
    teamData[myId] = { ...teamData[myId], ...patch };
    saveLocal();
    renderAll();
  }
}

async function writeSchedule(dayKey, schedId, data) {
  if (!myId) return;
  if (db) {
    const path = `team/${myId}/schedules/${dayKey}/${schedId}`;
    if (data === null) await remove(ref(db, path));
    else await set(ref(db, path), data);
  } else {
    if (!teamData[myId]) teamData[myId] = {};
    if (!teamData[myId].schedules) teamData[myId].schedules = {};
    if (!teamData[myId].schedules[dayKey]) teamData[myId].schedules[dayKey] = {};
    if (data === null) delete teamData[myId].schedules[dayKey][schedId];
    else teamData[myId].schedules[dayKey][schedId] = data;
    saveLocal();
    renderAll();
  }
}

// ─── Date helpers ─────────────────────────────────────────────────────────────
function getMondayOf(offset) {
  const d = new Date();
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1 - day);
  d.setDate(d.getDate() + diff + offset * 7);
  d.setHours(0,0,0,0);
  return d;
}
function dateKey(d) {
  return d.toISOString().slice(0,10);
}
function fmtWeekLabel(monday) {
  const sunday = new Date(monday); sunday.setDate(sunday.getDate()+6);
  const fmt = d => `${d.getMonth()+1}/${d.getDate()}`;
  return `${fmt(monday)} – ${fmt(sunday)}`;
}
function timeToMin(s) {
  const [h,m] = s.split(":").map(Number); return h*60+m;
}
function minToTime(m) {
  return `${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
}

// ─── Unique ID ────────────────────────────────────────────────────────────────
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

// ─── Toast ────────────────────────────────────────────────────────────────────
function showToast(msg, type="ok") {
  const t = document.createElement("div");
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  document.getElementById("toastArea").appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// ─── Setup modal ─────────────────────────────────────────────────────────────
function showSetup() {
  document.getElementById("setupModal").classList.add("open");
  renderColorPicker("setupColorPicker", myColor, c => { myColor = c; });
  document.getElementById("setupName").value = myName;
}
function hideSetup() {
  document.getElementById("setupModal").classList.remove("open");
}
async function saveSetup() {
  const name = document.getElementById("setupName").value.trim();
  if (!name) { document.getElementById("setupName").focus(); return; }
  myName  = name;
  if (!myId) myId = uid();
  localStorage.setItem("myId",    myId);
  localStorage.setItem("myName",  myName);
  localStorage.setItem("myColor", myColor);
  document.getElementById("userBadge").textContent = myName;
  document.getElementById("userBadge").style.background = myColor;
  await writeUser({ name: myName, color: myColor,
    status: teamData[myId]?.status || "office",
    task:   teamData[myId]?.task   || "" });
  hideSetup();
  renderAll();
}

// ─── Color picker ────────────────────────────────────────────────────────────
function renderColorPicker(containerId, selected, onChange) {
  const el = document.getElementById(containerId);
  el.innerHTML = COLORS.map(c =>
    `<span class="color-dot${c===selected?" selected":""}" style="background:${c}"
      data-c="${c}"></span>`
  ).join("");
  el.querySelectorAll(".color-dot").forEach(dot => {
    dot.onclick = () => {
      el.querySelectorAll(".color-dot").forEach(d=>d.classList.remove("selected"));
      dot.classList.add("selected");
      onChange(dot.dataset.c);
    };
  });
}

// ─── Render all ──────────────────────────────────────────────────────────────
function renderAll() {
  renderHeader();
  if (activeTab === "status") renderStatus();
  else if (activeTab === "team") renderTeam();
  else if (activeTab === "my")   renderMy();
}

function renderHeader() {
  document.title = t("appTitle");
  document.getElementById("appTitle").textContent = t("appTitle");
  document.querySelector('[data-tab="status"]').textContent = t("tabStatus");
  document.querySelector('[data-tab="team"]').textContent   = t("tabTeam");
  document.querySelector('[data-tab="my"]').textContent     = t("tabMy");
}

// ─── STATUS TAB ──────────────────────────────────────────────────────────────
function renderStatus() {
  const el = document.getElementById("statusContent");
  // My status card
  const me = teamData[myId] || {};
  const myStatusVal = me.status || "office";
  const myTask      = me.task   || "";

  const GROUP1 = ["office","remote","field","business"];
  const GROUP2 = ["training","seminar"];
  const GROUP3 = ["vacation","annual","halfAM","halfPM"];
  const mkBtn = ([k,v]) =>
    `<button class="status-btn${myStatusVal===k?" active":""}"
      style="${myStatusVal===k?`--sbg:${myColor};border-color:${myColor}`:""}"
      data-s="${k}">${v.icon} ${t(v.key)}</button>`;
  const statusBtns =
    `<div class="status-group">${GROUP1.map(k=>mkBtn([k,STATUS_META[k]])).join("")}</div>` +
    `<div class="status-group">${GROUP2.map(k=>mkBtn([k,STATUS_META[k]])).join("")}</div>` +
    `<div class="status-group">${GROUP3.map(k=>mkBtn([k,STATUS_META[k]])).join("")}</div>`;

  el.innerHTML = `
    <div class="my-status-card">
      <h3>${t("myStatus")}</h3>
      <div class="status-btns">${statusBtns}</div>
      <div class="task-row">
        <input id="taskInput" type="text" placeholder="${t("currentTaskPh")}"
          value="${escHtml(myTask)}" maxlength="80"/>
        <button class="btn-primary" onclick="saveTask()">${t("save")}</button>
      </div>
    </div>
    <div class="team-dashboard">
      ${renderDashboardCards()}
    </div>
  `;

  el.querySelectorAll(".status-btn").forEach(btn => {
    btn.onclick = async () => {
      await writeUser({ status: btn.dataset.s });
      showToast(t("statusUpdated"));
    };
  });
}

function renderDashboardCards() {
  const members = Object.entries(teamData).filter(([,v])=>v&&v.name);
  if (!members.length) return `<p class="empty-msg">${t("noSchedule")}</p>`;
  return members.map(([id, m]) => {
    const sm = STATUS_META[m.status] || STATUS_META.office;
    const isMe = id === myId;
    const now = new Date();
    const timeStr = now.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
    return `
      <div class="dash-card${isMe?" dash-card--me":""}">
        <div class="dash-card-top">
          <span class="member-avatar" style="background:${m.color||"#1a73e8"}">${(m.name||"?")[0]}</span>
          <div class="dash-card-info">
            <strong>${escHtml(m.name)}</strong>
            <span class="status-badge" style="background:${statusColor(m.status)}">${sm.icon} ${t(sm.key)}</span>
          </div>
        </div>
        ${m.task ? `<div class="dash-task">💬 ${escHtml(m.task)}</div>` : ""}
        <div class="dash-updated">${t("lastUpdated")}: ${timeStr}</div>
      </div>`;
  }).join("");
}

function statusColor(s) {
  const map = {
    office:   "#e8f5e9",
    remote:   "#e3f2fd",
    field:    "#fff3e0",
    business: "#fce4ec",
    training: "#e8eaf6",
    seminar:  "#f3e5f5",
    vacation: "#fce4ec",
    annual:   "#fce4ec",
    halfAM:   "#fff9c4",
    halfPM:   "#fff9c4",
  };
  return map[s] || "#f5f5f5";
}

window.saveTask = async function() {
  const val = document.getElementById("taskInput").value.trim();
  await writeUser({ task: val });
  showToast(t("statusUpdated"));
};

// ─── TEAM SCHEDULE TAB ───────────────────────────────────────────────────────
function renderTeam() {
  const el = document.getElementById("teamContent");
  const monday = getMondayOf(weekOffset);
  const days   = Array.from({length:7}, (_,i) => { const d=new Date(monday); d.setDate(d.getDate()+i); return d; });
  const members = Object.entries(teamData).filter(([,v])=>v&&v.name);

  // Build header
  const dayHeaders = days.map((d,i) => {
    const isToday = dateKey(d) === dateKey(new Date());
    return `<th class="${isToday?"today":""}">
      <span class="day-name">${t("days")[i]}</span>
      <span class="day-date">${d.getMonth()+1}/${d.getDate()}</span>
    </th>`;
  }).join("");

  // Rows: AM row (09-13) / PM row (14-18) / Full spans both
  const SLOT_ROWS = [
    { label:"AM", start:"09:00", end:"13:00" },
    { label:"PM", start:"14:00", end:"18:00" },
  ];
  const rows = SLOT_ROWS.map(row => {
    const cells = days.map(d => {
      const dk = dateKey(d);
      const blocks = [];
      members.forEach(([id,m]) => {
        const scheds = m.schedules?.[dk] || {};
        Object.entries(scheds).forEach(([sid, sc]) => {
          const slotKey = sc.slot || (sc.end <= "13:00" ? "AM" : sc.start >= "14:00" ? "PM" : "FULL");
          const show = slotKey === row.label || slotKey === "FULL";
          if (!show) return;
          blocks.push(`<div class="team-block" style="background:${hexAlpha(m.color||"#1a73e8",0.2)};border-left:3px solid ${m.color||"#1a73e8"}">
            <span class="block-name">${(m.name||"")[0]}</span>
            <span class="block-title">${escHtml(sc.title)}</span>
          </div>`);
        });
      });
      return `<td>${blocks.join("")}</td>`;
    }).join("");
    return `<tr><td class="time-cell">${row.label}<br><small>${row.start}</small></td>${cells}</tr>`;
  }).join("");

  // Legend
  const legend = members.map(([,m]) =>
    `<span class="legend-item"><span class="legend-dot" style="background:${m.color}"></span>${escHtml(m.name)}</span>`
  ).join("");

  el.innerHTML = `
    <div class="legend-row">${legend}</div>
    <div class="table-scroll">
      <table class="schedule-table">
        <thead><tr><th class="time-head"></th>${dayHeaders}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

// ─── MY SCHEDULE TAB ─────────────────────────────────────────────────────────
let myDayOffset = 0; // 0=Mon…6=Sun within the week

function renderMy() {
  if (!myId || !myName) {
    document.getElementById("myContent").innerHTML =
      `<div class="empty-msg" style="padding:40px;text-align:center">
        <button class="btn-primary" onclick="showSetup()">${t("welcome")}</button></div>`;
    return;
  }
  const monday = getMondayOf(weekOffset);
  const selDay = new Date(monday); selDay.setDate(selDay.getDate() + myDayOffset);
  const dk = dateKey(selDay);
  const scheds = teamData[myId]?.schedules?.[dk] || {};

  const dayTabs = Array.from({length:7}, (_,i) => {
    const d = new Date(monday); d.setDate(d.getDate()+i);
    const isToday = dateKey(d) === dateKey(new Date());
    return `<button class="day-tab${i===myDayOffset?" active":""}${isToday?" today":""}"
      data-di="${i}">${t("days")[i]}<br><small>${d.getMonth()+1}/${d.getDate()}</small></button>`;
  }).join("");

  const slotLabels = { AM: t("slotAM"), PM: t("slotPM"), FULL: t("slotFull") };
  const schedList = Object.entries(scheds).map(([sid, sc]) => {
    const slotKey = sc.slot || (sc.end <= "13:00" ? "AM" : sc.start >= "14:00" ? "PM" : "FULL");
    const badge = slotLabels[slotKey] || `${sc.start}–${sc.end}`;
    return `<div class="my-block" style="background:${hexAlpha(myColor,0.12)};border-left:4px solid ${myColor}">
      <div class="my-block-main">
        <span class="my-block-title">${escHtml(sc.title)}</span>
        <span class="my-block-badge">${badge}</span>
      </div>
      <button class="del-btn" data-sid="${sid}" data-dk="${dk}">×</button>
    </div>`;
  }).join("");

  document.getElementById("myContent").innerHTML = `
    <div class="day-tabs">${dayTabs}</div>
    <div class="my-schedule-area">
      ${schedList || `<p class="empty-day">${t("noSchedule")}</p>`}
      <button class="add-day-btn" data-dk="${dk}">+ ${t("add")}</button>
    </div>
  `;

  document.querySelectorAll(".day-tab").forEach(btn => {
    btn.onclick = () => { myDayOffset = +btn.dataset.di; renderMy(); };
  });
  document.querySelectorAll(".add-day-btn").forEach(btn => {
    btn.onclick = () => openAddModal(btn.dataset.dk);
  });
  document.querySelectorAll(".del-btn").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm(t("confirmDelete"))) return;
      await writeSchedule(btn.dataset.dk, btn.dataset.sid, null);
      showToast(t("scheduleDeleted"));
    };
  });
}

// ─── Time slot definitions ────────────────────────────────────────────────────
const TIMESLOTS = {
  AM:   { start: "09:00", end: "13:00" },
  PM:   { start: "14:00", end: "18:00" },
  FULL: { start: "09:00", end: "18:00" },
};
let selectedSlot = "FULL"; // default

// ─── Add schedule modal ───────────────────────────────────────────────────────
function openAddModal(dk) {
  selectedSlot = "FULL";
  document.getElementById("addModal").classList.add("open");
  document.getElementById("addTitle").value = "";
  document.getElementById("addDk").value    = dk;
  renderSlotBtns();
  document.getElementById("addTitle").focus();
}
function renderSlotBtns() {
  document.querySelectorAll(".slot-pick-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.slot === selectedSlot);
  });
}
function closeAddModal() {
  document.getElementById("addModal").classList.remove("open");
}
window.closeAddModal = closeAddModal;
window.pickSlot = function(slot) {
  selectedSlot = slot;
  renderSlotBtns();
};

window.saveAddModal = async function() {
  const title = document.getElementById("addTitle").value.trim();
  const dk    = document.getElementById("addDk").value;
  if (!title) { document.getElementById("addTitle").focus(); return; }
  const { start, end } = TIMESLOTS[selectedSlot];
  const id = uid();
  await writeSchedule(dk, id, { title, start, end, slot: selectedSlot });
  closeAddModal();
  showToast(t("scheduleAdded"));
};

// ─── Week nav ─────────────────────────────────────────────────────────────────
window.prevWeek = () => { weekOffset--; updateWeekLabel(); renderAll(); };
window.nextWeek = () => { weekOffset++; updateWeekLabel(); renderAll(); };
window.goToday  = () => { weekOffset = 0; updateWeekLabel(); renderAll(); };

function updateWeekLabel() {
  const m = getMondayOf(weekOffset);
  document.getElementById("weekLabel").textContent = fmtWeekLabel(m);
}

// ─── Language toggle ──────────────────────────────────────────────────────────
window.toggleLang = function() {
  lang = lang === "ko" ? "en" : "ko";
  localStorage.setItem("lang", lang);
  document.getElementById("langBtn").textContent = lang === "ko" ? "EN" : "한";
  renderAll();
  updateWeekLabel();
};

// ─── Tab switch ───────────────────────────────────────────────────────────────
window.switchTab = function(tab) {
  activeTab = tab;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab===tab));
  ["statusContent","teamContent","myContent"].forEach(id => {
    document.getElementById(id).style.display = "none";
  });
  document.getElementById(tab+"Content").style.display = "block";
  renderAll();
};

// ─── Helpers ──────────────────────────────────────────────────────────────────
function escHtml(s) { return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function hexAlpha(hex, a) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
window.showSetup  = showSetup;
window.hideSetup  = hideSetup;
window.saveSetup  = saveSetup;

(function boot() {
  updateWeekLabel();
  document.getElementById("langBtn").textContent = lang === "ko" ? "EN" : "한";

  if (myName) {
    document.getElementById("userBadge").textContent = myName;
    document.getElementById("userBadge").style.background = myColor;
  }

  const ok = initFirebase();
  if (!ok) loadLocal();

  // Auto-refresh status tab every 60s
  setInterval(() => { if (activeTab==="status") renderStatus(); }, 60000);

  if (!myName) showSetup();
})();
</script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #1a73e8;
  --surface: #fff;
  --bg: #f8f9fa;
  --border: #dadce0;
  --text: #202124;
  --text2: #5f6368;
  --shadow: 0 1px 4px rgba(0,0,0,.12);
  --radius: 10px;
}
html { font-size: 14px; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* ── Header ── */
.app-header {
  position: sticky; top: 0; z-index: 100;
  background: #fff; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
  padding: 0 16px; height: 56px;
}
.app-header h1 { font-size: 1.1rem; font-weight: 700; color: var(--primary); flex: 1; }
#connStatus { font-size: .75rem; color: var(--text2); }
#langBtn {
  border: 1px solid var(--border); border-radius: 6px;
  background: #fff; padding: 4px 10px; cursor: pointer; font-weight: 600;
}
.user-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 50%;
  color: #fff; font-weight: 700; cursor: pointer; font-size: .85rem;
  border: 2px solid rgba(255,255,255,.6);
}

/* ── Tabs ── */
.tabs {
  display: flex; background: #fff; border-bottom: 1px solid var(--border);
  overflow-x: auto;
}
.tab-btn {
  flex: 1; padding: 14px 8px; border: none; background: none;
  font-size: .88rem; color: var(--text2); cursor: pointer;
  border-bottom: 3px solid transparent; white-space: nowrap;
  transition: all .2s;
}
.tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

/* ── Week nav ── */
.week-nav {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px; background: #fff; border-bottom: 1px solid var(--border);
}
.week-nav button {
  border: 1px solid var(--border); border-radius: 6px;
  background: #fff; padding: 5px 12px; cursor: pointer; font-size: .82rem;
}
.week-nav button:hover { background: var(--bg); }
#weekLabel { flex: 1; text-align: center; font-weight: 600; font-size: .95rem; }

/* ── Content areas ── */
#statusContent, #teamContent, #myContent {
  padding: 16px; max-width: 1100px; margin: 0 auto;
}

/* ── My status card ── */
.my-status-card {
  background: #fff; border-radius: var(--radius); padding: 16px;
  box-shadow: var(--shadow); margin-bottom: 20px;
}
.my-status-card h3 { margin-bottom: 12px; font-size: 1rem; }
.status-btns { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.status-group { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.status-group:last-child { border-bottom: none; padding-bottom: 0; }
.status-btn {
  border: 2px solid var(--border); border-radius: 20px;
  background: #fff; padding: 6px 14px; cursor: pointer; font-size: .85rem;
  transition: all .15s;
}
.status-btn.active {
  background: var(--sbg, var(--primary));
  border-color: var(--sbg, var(--primary));
  color: #fff; font-weight: 600;
}
.task-row { display: flex; gap: 8px; }
.task-row input {
  flex: 1; border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 12px; font-size: .9rem;
}
.task-row input:focus { outline: none; border-color: var(--primary); }

/* ── Dashboard cards ── */
.team-dashboard {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px;
}
.dash-card {
  background: #fff; border-radius: var(--radius); padding: 14px;
  box-shadow: var(--shadow); border-left: 4px solid transparent;
}
.dash-card--me { border-left-color: var(--primary); }
.dash-card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.member-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center;
  font-size: 1rem; flex-shrink: 0;
}
.dash-card-info { display: flex; flex-direction: column; gap: 3px; }
.dash-card-info strong { font-size: .95rem; }
.status-badge {
  display: inline-block; border-radius: 12px; padding: 2px 8px;
  font-size: .78rem; font-weight: 500;
}
.dash-task {
  font-size: .83rem; color: var(--text2);
  padding: 6px 8px; background: var(--bg); border-radius: 6px; margin-bottom: 6px;
}
.dash-updated { font-size: .73rem; color: #aaa; }

/* ── Schedule table ── */
.legend-row {
  display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px;
}
.legend-item { display: flex; align-items: center; gap: 5px; font-size: .82rem; }
.legend-dot { width: 12px; height: 12px; border-radius: 50%; }

.table-scroll { overflow-x: auto; }
.schedule-table {
  width: 100%; border-collapse: collapse; min-width: 600px;
  background: #fff; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
}
.schedule-table th, .schedule-table td {
  border: 1px solid var(--border); padding: 4px 6px; vertical-align: top;
  min-width: 90px;
}
.schedule-table th {
  background: #f1f3f4; text-align: center; position: sticky; top: 0;
}
th.today, td.today { background: #e8f0fe; }
.time-cell { width: 52px; min-width: 52px; color: var(--text2); font-size: .78rem; text-align: right; padding-right: 6px; white-space: nowrap; }
.time-head { width: 52px; }
.day-name { display: block; font-weight: 700; font-size: .88rem; }
.day-date { font-size: .75rem; color: var(--text2); }

.team-block {
  border-radius: 4px; padding: 3px 5px; margin-bottom: 3px;
  font-size: .77rem; line-height: 1.3;
}
.block-name { font-weight: 700; margin-right: 3px; }
.block-title { }
.block-time { display: block; font-size: .7rem; color: var(--text2); }

/* ── Slot picker ── */
.slot-pick {
  display: flex; gap: 8px; flex-wrap: wrap;
}
.slot-pick-btn {
  flex: 1; min-width: 90px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  border: 2px solid var(--border); border-radius: 10px;
  background: #fff; padding: 10px 8px; cursor: pointer;
  font-size: .88rem; line-height: 1.3; transition: all .15s;
}
.slot-pick-btn small { font-size: .72rem; color: var(--text2); }
.slot-pick-btn.active {
  border-color: var(--primary); background: var(--primary);
  color: #fff; font-weight: 700;
}
.slot-pick-btn.active small { color: rgba(255,255,255,.8); }

/* ── My schedule area ── */
.my-schedule-area { padding: 4px 0; }
.my-block {
  display: flex; align-items: center; gap: 10px;
  border-radius: 8px; padding: 12px 14px; margin-bottom: 8px;
}
.my-block-main { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.my-block-title { font-size: .95rem; font-weight: 600; }
.my-block-badge {
  display: inline-block; font-size: .75rem; color: var(--text2);
  background: rgba(0,0,0,.06); border-radius: 10px; padding: 2px 8px;
}
.empty-day { color: var(--text2); font-size: .9rem; padding: 24px 0; text-align: center; }
.add-day-btn {
  width: 100%; border: 2px dashed var(--border); border-radius: 8px;
  background: none; padding: 12px; cursor: pointer; font-size: .9rem;
  color: var(--text2); margin-top: 4px; transition: all .15s;
}
.add-day-btn:hover { border-color: var(--primary); color: var(--primary); }

/* ── My schedule tab ── */
.day-tabs {
  display: flex; gap: 4px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 8px;
}
.day-tab {
  flex: 1; min-width: 44px; text-align: center;
  border: 1px solid var(--border); border-radius: 8px; padding: 6px 4px;
  background: #fff; cursor: pointer; font-size: .78rem; line-height: 1.3;
  transition: all .15s;
}
.day-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 700; }
.day-tab.today:not(.active) { border-color: var(--primary); color: var(--primary); }
.day-tab small { display: block; }

.my-table { min-width: 320px; }
.slot-cell { position: relative; min-height: 44px; }
.del-btn {
  background: none; border: none; color: #e53935;
  font-size: 1.2rem; cursor: pointer; padding: 0 4px; line-height: 1; flex-shrink: 0;
}

/* ── Modals ── */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.4); z-index: 200;
  align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: #fff; border-radius: var(--radius); padding: 24px;
  width: min(400px, 94vw); box-shadow: 0 8px 32px rgba(0,0,0,.18);
}
.modal h2 { font-size: 1.1rem; margin-bottom: 16px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: .82rem; color: var(--text2); margin-bottom: 4px; }
.form-group input[type="text"],
.form-group input[type="time"] {
  width: 100%; border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 12px; font-size: .95rem;
}
.form-group input:focus { outline: none; border-color: var(--primary); }
.time-row { display: flex; gap: 10px; }
.time-row .form-group { flex: 1; }
.color-picker { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 0; }
.color-dot {
  width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
  border: 3px solid transparent; transition: border-color .15s;
}
.color-dot.selected { border-color: #202124; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
.btn-primary {
  background: var(--primary); color: #fff;
  border: none; border-radius: 8px; padding: 8px 18px;
  cursor: pointer; font-size: .9rem; font-weight: 600;
}
.btn-primary:hover { filter: brightness(1.1); }
.btn-ghost {
  background: none; border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 18px; cursor: pointer; font-size: .9rem;
}

/* ── Toast ── */
#toastArea { position: fixed; bottom: 20px; right: 20px; z-index: 999; display: flex; flex-direction: column; gap: 8px; }
.toast {
  padding: 10px 18px; border-radius: 8px; font-size: .88rem;
  box-shadow: var(--shadow); animation: slideIn .25s ease;
  max-width: 280px;
}
.toast-ok   { background: #202124; color: #fff; }
.toast-warn { background: #f57c00; color: #fff; }
.toast-info { background: #1a73e8; color: #fff; }
@keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.empty-msg { color: var(--text2); font-size: .9rem; }

/* ── Responsive ── */
@media (max-width: 600px) {
  .app-header h1 { font-size: .95rem; }
  #statusContent, #teamContent, #myContent { padding: 10px; }
  .team-dashboard { grid-template-columns: 1fr 1fr; }
  .schedule-table th, .schedule-table td { min-width: 68px; padding: 3px 4px; }
}
</style>
</head>
<body>

<!-- ── App Header ── -->
<header class="app-header">
  <h1 id="appTitle">Team Schedule</h1>
  <span id="connStatus" style="color:#aaa;font-size:.75rem"></span>
  <button id="langBtn" onclick="toggleLang()">EN</button>
  <span id="userBadge" class="user-badge" onclick="showSetup()" title="프로필 수정">?</span>
</header>

<!-- ── Tabs ── -->
<nav class="tabs">
  <button class="tab-btn active" data-tab="status" onclick="switchTab('status')">실시간 현황판</button>
  <button class="tab-btn"        data-tab="team"   onclick="switchTab('team')">팀 전체 일정</button>
  <button class="tab-btn"        data-tab="my"     onclick="switchTab('my')">내 일정 입력</button>
</nav>

<!-- ── Week nav (shown on team/my tabs) ── -->
<div class="week-nav" id="weekNav" style="display:none">
  <button onclick="prevWeek()">‹</button>
  <span id="weekLabel"></span>
  <button onclick="goToday()">●</button>
  <button onclick="nextWeek()">›</button>
</div>

<!-- ── Content ── -->
<div id="statusContent"></div>
<div id="teamContent"   style="display:none"></div>
<div id="myContent"     style="display:none"></div>

<!-- ── Toast area ── -->
<div id="toastArea"></div>

<!-- ── Setup Modal ── -->
<div class="modal-overlay" id="setupModal">
  <div class="modal">
    <h2 id="setupTitle">프로필 설정</h2>
    <div class="form-group">
      <label id="setupNameLabel">이름 / Name</label>
      <input id="setupName" type="text" placeholder="이름을 입력하세요" maxlength="20"/>
    </div>
    <div class="form-group">
      <label>색상 / Color</label>
      <div class="color-picker" id="setupColorPicker"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="hideSetup()">취소</button>
      <button class="btn-primary" onclick="saveSetup()">저장</button>
    </div>
  </div>
</div>

<!-- ── Add Schedule Modal ── -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2>일정 추가</h2>
    <input type="hidden" id="addDk"/>
    <div class="form-group">
      <label>내용 / Title</label>
      <input id="addTitle" type="text" placeholder="일정 내용" maxlength="60"
        onkeydown="if(event.key==='Enter')saveAddModal()"/>
    </div>
    <div class="form-group">
      <label>시간대 / Time Slot</label>
      <div class="slot-pick">
        <button class="slot-pick-btn" data-slot="AM"   onclick="pickSlot('AM')">
          🌅 <span class="slot-ko">오전</span><span class="slot-en">Morning</span>
          <small>09:00 – 13:00</small>
        </button>
        <button class="slot-pick-btn" data-slot="PM"   onclick="pickSlot('PM')">
          🌆 <span class="slot-ko">오후</span><span class="slot-en">Afternoon</span>
          <small>14:00 – 18:00</small>
        </button>
        <button class="slot-pick-btn active" data-slot="FULL" onclick="pickSlot('FULL')">
          ☀️ <span class="slot-ko">하루</span><span class="slot-en">Full Day</span>
          <small>09:00 – 18:00</small>
        </button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeAddModal()">취소 / Cancel</button>
      <button class="btn-primary" onclick="saveAddModal()">추가 / Add</button>
    </div>
  </div>
</div>

<script>
// Tab switching shows/hides week nav
const _origSwitch = window.switchTab;
window.switchTab = function(tab) {
  _origSwitch(tab);
  document.getElementById("weekNav").style.display = (tab==="team"||tab==="my") ? "flex" : "none";
};
</script>

</body>
</html>
