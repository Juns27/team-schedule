// ── Firebase ──────────────────────────────────────────────────
function initFirebase() {
  const app = initializeApp(FIREBASE_CONFIG);
  db = getDatabase(app);
  document.getElementById("connStatus").textContent = "● " + t("connecting");
  onValue(ref(db, "team"), snap => {
    teamData = snap.val() || {};
    renderAll();
    document.getElementById("connStatus").textContent = "● " + t("connected");
    document.getElementById("connStatus").style.color = "#43a047";
  });
}

async function writeUser(patch) {
  if (!myId || !db) return;
  await update(ref(db, `team/${myId}`), patch);
}
async function writeSchedule(dayKey, schedId, data) {
  if (!myId || !db) return;
  const path = `team/${myId}/schedules/${dayKey}/${schedId}`;
  if (data === null) await remove(ref(db, path));
  else await set(ref(db, path), data);
}

// ── PIN 로그인 ─────────────────────────────────────────────────
function showLoginModal() {
  pinStep   = "select";
  pinTarget = null;
  pinFirst  = "";
  document.getElementById("loginModal").classList.add("open");
  renderLoginModal();
}
function hideLoginModal() {
  document.getElementById("loginModal").classList.remove("open");
  clearPinBoxes();
}

function renderLoginModal() {
  const titleEl = document.getElementById("loginTitle");
  const descEl  = document.getElementById("loginDesc");
  const gridEl  = document.getElementById("memberGrid");
  const pinArea = document.getElementById("pinArea");
  const backBtn = document.getElementById("loginBackBtn");

  clearPinBoxes();

  if (pinStep === "select") {
    titleEl.textContent = t("selectUser");
    descEl.textContent  = t("selectUserDesc");
    gridEl.style.display = "grid";
    pinArea.style.display = "none";
    backBtn.style.display = "none";

    gridEl.innerHTML = MEMBERS.map(m =>
      `<button class="member-pick" style="--mc:${m.color}" data-id="${m.id}">
        <span class="mp-avatar" style="background:${m.color}">${m.name[0]}</span>
        <div class="mp-info">
          <span class="mp-name">${m.name}</span>
          <span class="mp-email">${m.email}</span>
        </div>
      </button>`
    ).join("");

    gridEl.querySelectorAll(".member-pick").forEach(btn => {
      btn.onclick = () => startPinStep(btn.dataset.id);
    });

  } else {
    const member = MEMBERS.find(m => m.id === pinTarget);
    gridEl.style.display = "none";
    pinArea.style.display = "flex";
    backBtn.style.display = "inline-block";

    // 아바타
    document.getElementById("pinAvatar").textContent    = member.name[0];
    document.getElementById("pinAvatar").style.background = member.color;
    document.getElementById("pinMemberName").textContent  = member.name;
    document.getElementById("pinMemberEmail").textContent = member.email;

    if (pinStep === "pin_set") {
      titleEl.textContent = t("pinSet");
      descEl.textContent  = t("pinSetDesc");
    } else if (pinStep === "pin_confirm") {
      titleEl.textContent = t("pinConfirm");
      descEl.textContent  = t("pinConfirmDesc");
    } else {
      titleEl.textContent = t("pinLogin");
      descEl.textContent  = t("pinLoginDesc");
    }

    // 포커스 첫 번째 박스
    setTimeout(() => document.querySelector(".pin-box")?.focus(), 100);
  }
}

async function startPinStep(memberId) {
  pinTarget = memberId;
  const snap = await get(ref(db, `team/${memberId}/pin`));
  pinStep = snap.val() ? "pin_login" : "pin_set";
  renderLoginModal();
}

function clearPinBoxes() {
  document.querySelectorAll(".pin-box").forEach(b => { b.value = ""; });
}

function getPinValue() {
  return Array.from(document.querySelectorAll(".pin-box")).map(b => b.value).join("");
}

async function submitPin() {
  const pin = getPinValue();
  if (pin.length < 4) return;

  if (pinStep === "pin_set") {
    pinFirst = pin;
    pinStep  = "pin_confirm";
    renderLoginModal();

  } else if (pinStep === "pin_confirm") {
    if (pin !== pinFirst) {
      showToast(t("pinMismatch"), "warn");
      clearPinBoxes();
      document.querySelector(".pin-box")?.focus();
      return;
    }
    // PIN 저장 후 로그인
    await set(ref(db, `team/${pinTarget}/pin`), pin);
    await loginAs(pinTarget);

  } else if (pinStep === "pin_login") {
    const snap = await get(ref(db, `team/${pinTarget}/pin`));
    if (snap.val() !== pin) {
      showToast(t("pinWrong"), "warn");
      clearPinBoxes();
      document.querySelector(".pin-box")?.focus();
      // 틀린 박스 흔들기 애니메이션
      document.getElementById("pinBoxes").classList.add("shake");
      setTimeout(() => document.getElementById("pinBoxes").classList.remove("shake"), 500);
      return;
    }
    await loginAs(pinTarget);
  }
}

async function loginAs(memberId) {
  myId = memberId;
  localStorage.setItem("myId", myId);
  const m = myMember();
  await update(ref(db, `team/${myId}`), {
    name:   m.name,
    color:  m.color,
    email:  m.email,
    status: teamData[myId]?.status || "office",
    task:   teamData[myId]?.task   || "",
  });
  hideLoginModal();
  updateHeader();
  showToast(t("pinOk"));
  renderAll();
}

window.doLogout = async function() {
  if (!confirm(t("logoutConfirm"))) return;
  myId = null;
  localStorage.removeItem("myId");
  updateHeader();
  showLoginModal();
};

// 마스터: PIN 초기화
window.masterResetPin = async function(memberId) {
  const m = MEMBERS.find(x => x.id === memberId);
  if (!confirm(`${m.name}의 PIN을 초기화할까요?`)) return;
  await set(ref(db, `team/${memberId}/pin`), null);
  showToast(t("pinReset"));
  renderMasterPanel();
};

// PIN 박스 키보드 처리
window.onPinKeydown = function(e, idx) {
  const boxes = document.querySelectorAll(".pin-box");
  if (e.key === "Backspace" && !boxes[idx].value && idx > 0) {
    boxes[idx-1].focus();
  }
};
window.onPinInput = function(e, idx) {
  const boxes = document.querySelectorAll(".pin-box");
  const val = e.target.value.replace(/\D/g,"");
  e.target.value = val.slice(-1);
  if (val && idx < 3) boxes[idx+1].focus();
  if (idx === 3 && getPinValue().length === 4) submitPin();
};

// ── STATUS ────────────────────────────────────────────────────
function renderStatus() {
  const el = document.getElementById("statusContent");
  const me = teamData[myId] || {};
  const myStatusVal = me.status || "office";
  const myTask = me.task || "";

  const mkBtn = k => {
    const v = STATUS_META[k], active = myStatusVal===k;
    return `<button class="status-btn${active?" active":""}"
      style="${active?`--sbg:${myMember()?.color||"#1a73e8"};border-color:${myMember()?.color||"#1a73e8"}`:""}"
      data-s="${k}">${v.icon} ${t(v.key)}</button>`;
  };

  el.innerHTML = `
    <div class="my-status-card">
      <h3>${t("myStatus")} — <span style="color:${myMember()?.color||"#aaa"}">${myMember()?.name||""}</span></h3>
      <div class="status-btns">
        <div class="status-group">${Object.keys(STATUS_META).map(mkBtn).join("")}</div>
      </div>
      <div class="task-row">
        <input id="taskInput" type="text" placeholder="${t("currentTaskPh")}"
          value="${escHtml(myTask)}" maxlength="80"/>
        <button class="btn-primary" onclick="saveTask()">${t("save")}</button>
      </div>
    </div>
    <div class="team-dashboard">${renderDashboardCards()}</div>`;

  el.querySelectorAll(".status-btn").forEach(btn => {
    btn.onclick = async () => { await writeUser({status:btn.dataset.s}); showToast(t("statusUpdated")); };
  });
}

function renderDashboardCards() {
  return MEMBERS.map(member => {
    const m  = teamData[member.id] || {};
    const sm = STATUS_META[m.status] || STATUS_META.office;
    const isMe = member.id === myId;
    const isOnline = !!m.name;
    return `<div class="dash-card${isMe?" dash-card--me":""}" style="${isMe?`--mc:${member.color}`:""}">
      <div class="dash-card-top">
        <span class="member-avatar" style="background:${member.color}">${member.name[0]}</span>
        <div class="dash-card-info">
          <strong>${escHtml(member.name)}</strong>
          <span class="status-badge" style="background:${statusColor(m.status)}">${sm.icon} ${t(sm.key)}</span>
        </div>
        <span class="online-dot" style="background:${isOnline?"#43a047":"#ccc"}"
          title="${isOnline?"접속 기록 있음":"미접속"}"></span>
      </div>
      ${m.task?`<div class="dash-task">💬 ${escHtml(m.task)}</div>`:""}
    </div>`;
  }).join("");
}

function statusColor(s) {
  return ({office:"#e8f5e9",remote:"#e3f2fd",field:"#fff3e0",business:"#fce4ec",
    vacation:"#fce4ec",training:"#e8eaf6",annual:"#fff9c4",
    holiday:"#fce4ec",sickLeave:"#fdf0f0",
    seminar:"#f3e5f5",refresh:"#e8f5e9",halfAM:"#fff9c4",halfPM:"#fff9c4"})[s]||"#f5f5f5";
}

window.saveTask = async function() {
  await writeUser({task: document.getElementById("taskInput").value.trim()});
  showToast(t("statusUpdated"));
};

// ── TEAM SCHEDULE ─────────────────────────────────────────────
function renderTeam() {
  const el = document.getElementById("teamContent");
  const monday = getMondayOf(weekOffset);
  // 월~금 5일만
  const days = Array.from({length:5},(_,i)=>{ const d=new Date(monday); d.setDate(d.getDate()+i); return d; });

  const dayHeaders = days.map((d,i)=>{
    const isToday = dateKey(d)===dateKey(new Date());
    return `<th class="${isToday?"today":""}">
      <span class="day-name">${t("days")[i]}</span>
      <span class="day-date">${d.getMonth()+1}/${d.getDate()}</span></th>`;
  }).join("");

  const rows = MEMBERS.map(member=>{
    const cells = days.map(d=>{
      const dk = dateKey(d);
      const scheds = (teamData[member.id]?.schedules?.[dk]) || {};
      const blocks = Object.values(scheds).map(sc=>{
        const sk = sc.slot||(sc.end<="13:00"?"AM":sc.start>="14:00"?"PM":"FULL");
        const slotLabel = {AM:"오전",PM:"오후",FULL:""}[sk]||"";
        return `<div class="team-block" style="background:${hexAlpha(member.color,0.18)};border-left:3px solid ${member.color}">
          ${slotLabel?`<span class="block-slot">${slotLabel}</span>`:""}
          <span class="block-title">${escHtml(sc.title)}</span>
        </div>`;
      });
      const isToday = dateKey(d)===dateKey(new Date());
      return `<td class="${isToday?"today":""}">${blocks.join("")}</td>`;
    }).join("");

    return `<tr>
      <td class="member-cell">
        <span class="member-dot" style="background:${member.color}"></span>
        <span class="member-cell-name">${member.name}</span>
      </td>
      ${cells}
    </tr>`;
  }).join("");

  el.innerHTML=`
    <div class="team-toolbar">
      <button class="btn-tool" onclick="sendWeekEmail()">📧 이메일 송부</button>
      <button class="btn-tool" onclick="openExcelModal()">📊 월별 엑셀 저장</button>
    </div>
    <div class="table-scroll">
      <table class="schedule-table">
        <thead><tr><th class="member-head"></th>${dayHeaders}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

    return;
  }
  const monday = getMondayOf(weekOffset);
  const selDay = new Date(monday); selDay.setDate(selDay.getDate()+myDayOffset);
  const dk = dateKey(selDay);
  const scheds = teamData[myId]?.schedules?.[dk]||{};
  const member = myMember();
  const slotLabels={AM:t("slotAM"),PM:t("slotPM"),FULL:t("slotFull")};

  const dayTabs=Array.from({length:7},(_,i)=>{
    const d=new Date(monday); d.setDate(d.getDate()+i);
    const isToday=dateKey(d)===dateKey(new Date());
    return `<button class="day-tab${i===myDayOffset?" active":""}${isToday?" today":""}" data-di="${i}">
      ${t("days")[i]}<br><small>${d.getMonth()+1}/${d.getDate()}</small></button>`;
  }).join("");

  const schedList=Object.entries(scheds).map(([sid,sc])=>{
    const sk=sc.slot||(sc.end<="13:00"?"AM":sc.start>="14:00"?"PM":"FULL");
    return `<div class="my-block" style="background:${hexAlpha(member.color,0.12)};border-left:4px solid ${member.color}">
      <div class="my-block-main">
        <span class="my-block-title">${escHtml(sc.title)}</span>
        <span class="my-block-badge">${slotLabels[sk]||""}</span>
      </div>
      <button class="del-btn" data-sid="${sid}" data-dk="${dk}">×</button>
    </div>`;
  }).join("");

  container.innerHTML=`
    <div class="day-tabs">${dayTabs}</div>
    <div class="my-schedule-area">
      ${schedList||`<p class="empty-day">${t("noSchedule")}</p>`}
      <button class="add-day-btn" data-dk="${dk}">+ ${t("add")}</button>
    </div>`;

  container.querySelectorAll(".day-tab").forEach(b=>{b.onclick=()=>{myDayOffset=+b.dataset.di;renderMy();};});
  container.querySelectorAll(".add-day-btn").forEach(b=>{b.onclick=()=>openAddModal(b.dataset.dk);});
  container.querySelectorAll(".del-btn").forEach(b=>{
    b.onclick=async()=>{
      if(!confirm(t("confirmDelete"))) return;
      await writeSchedule(b.dataset.dk,b.dataset.sid,null);
      showToast(t("scheduleDeleted"));
    };
  });
}

// ── Add modal ─────────────────────────────────────────────────
function openAddModal(dk) {

function renderSlotBtns() {

// 일정 유형 빠른 선택 — 제목 자동 입력 + 슬롯 자동 선택
const QUICK_TYPES = {
  office:   {label:()=>t("statusOffice"),   slot:"FULL"},
  remote:   {label:()=>t("statusRemote"),   slot:"FULL"},
  field:    {label:()=>t("statusField"),    slot:"FULL"},

  seminar:  {label:()=>t("schedSeminar"),   slot:"FULL"},
  refresh:  {label:()=>t("schedRefresh"),   slot:"FULL"},
  annual:   {label:()=>t("schedAnnual"),    slot:"FULL"},
  halfAM:   {label:()=>t("schedHalfAM"),    slot:"AM"},
  halfPM:   {label:()=>t("schedHalfPM"),    slot:"PM"},

window.pickSchedType=function(key){

window.closeAddModal=()=>document.getElementById("addModal").classList.remove("open");
window.saveAddModal=async function(){
  const title=document.getElementById("addTitle").value.trim();
  const dk=document.getElementById("addDk").value;
  if(!title){document.getElementById("addTitle").focus();return;}
  const {start,end}=TIMESLOTS[selectedSlot];

  window.closeAddModal();
  showToast(t("scheduleAdded"));

// ── 주간 이메일 송부 ──────────────────────────────────────────
window.sendWeekEmail = function() {
  const monday = getMondayOf(weekOffset);
  const days = Array.from({length:5},(_,i)=>{ const d=new Date(monday); d.setDate(d.getDate()+i); return d; });
  const dayNames = t("days");
  const slotLabel = sk => ({AM:"[오전]",PM:"[오후]",FULL:""})[sk]||"";

  let body = `[팀 주간 일정]\n`;
  body += `${fmtDate(days[0])} (${dayNames[0]}) ~ ${fmtDate(days[4])} (${dayNames[4]})\n`;
  body += `${"─".repeat(40)}\n\n`;

  MEMBERS.forEach(member => {
    const lines = [];
    days.forEach((d, i) => {
      const dk = dateKey(d);
      const scheds = teamData[member.id]?.schedules?.[dk] || {};
      const entries = Object.values(scheds).map(sc => {
        const sk = sc.slot||(sc.end<="13:00"?"AM":sc.start>="14:00"?"PM":"FULL");
        return slotLabel(sk) ? `${slotLabel(sk)} ${sc.title}` : sc.title;
      });
      if (entries.length) lines.push(`  ${dayNames[i]}(${fmtDate(d)}): ${entries.join(", ")}`);
    });
    body += `▶ ${member.name}\n`;
    body += lines.length ? lines.join("\n") + "\n" : `  (일정 없음)\n`;
    body += "\n";
  });

  const subject = encodeURIComponent(`[팀 일정] ${fmtDate(days[0])} ~ ${fmtDate(days[4])}`);
  const emails = MEMBERS.map(m=>m.email).join(",");
  window.location.href = `mailto:${emails}?subject=${subject}&body=${encodeURIComponent(body)}`;
};

// ── 월별 엑셀 저장 ────────────────────────────────────────────
window.openExcelModal = function() {
  const now = new Date();
  document.getElementById("excelYear").value  = now.getFullYear();
  document.getElementById("excelMonth").value = now.getMonth()+1;
  document.getElementById("excelModal").classList.add("open");
};
window.closeExcelModal = () => document.getElementById("excelModal").classList.remove("open");

window.downloadMonthExcel = function() {
  const year  = parseInt(document.getElementById("excelYear").value);
  const month = parseInt(document.getElementById("excelMonth").value);
  if (!year || month<1 || month>12) return;

  const dayNames = t("days");
  const wb = XLSX.utils.book_new();

  // 해당 월의 모든 주(월~금) 수집
  const weeks = getWeeksOfMonth(year, month);

  weeks.forEach((monday, wi) => {
    const days = Array.from({length:5},(_,i)=>{ const d=new Date(monday); d.setDate(d.getDate()+i); return d; });
    const header = ["이름", ...days.map((d,i)=>`${dayNames[i]} ${fmtDate(d)}`)];
    const rows = MEMBERS.map(member => {
      const row = [member.name];
      days.forEach(d => {
        const dk = dateKey(d);
        const scheds = teamData[member.id]?.schedules?.[dk] || {};
        const entries = Object.values(scheds).map(sc => {
          const sk = sc.slot||(sc.end<="13:00"?"AM":sc.start>="14:00"?"PM":"FULL");
          return sk==="AM"?"[오전] "+sc.title : sk==="PM"?"[오후] "+sc.title : sc.title;
        });
        row.push(entries.join("\n") || "");
      });
      return row;
    });

    const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);

    // 열 너비 설정
    ws["!cols"] = [{wch:12}, {wch:22},{wch:22},{wch:22},{wch:22},{wch:22}];
    // 행 높이
    ws["!rows"] = [{hpt:20}, ...MEMBERS.map(()=>({hpt:40}))];

    const sheetName = `${month}월 ${wi+1}주`;
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
  });

  XLSX.writeFile(wb, `팀일정_${year}년_${month}월.xlsx`);
  window.closeExcelModal();
  showToast(`${year}년 ${month}월 엑셀 저장 완료`);
};

function getWeeksOfMonth(year, month) {
  const mondays = [];
  const d = new Date(year, month-1, 1);
  // 해당 월 1일이 속한 주의 월요일로 이동
  const day = d.getDay();
  d.setDate(d.getDate() + (day===0 ? -6 : 1-day));
  while (true) {
    // 이 월요일의 금요일
    const fri = new Date(d); fri.setDate(fri.getDate()+4);
    // 금요일이 해당 월이거나, 월요일이 해당 월이면 포함
    if (d.getMonth()+1 > month) break;
    if (fri.getMonth()+1 >= month || d.getMonth()+1 === month) mondays.push(new Date(d));
    d.setDate(d.getDate()+7);
  }
  return mondays;
}

function fmtDate(d) {
  return `${d.getMonth()+1}/${d.getDate()}`;
}

// ── Week nav ──────────────────────────────────────────────────
window.prevWeek=()=>{weekOffset--;updateWeekLabel();renderAll();};
window.nextWeek=()=>{weekOffset++;updateWeekLabel();renderAll();};
window.goToday =()=>{weekOffset=0;updateWeekLabel();renderAll();};
function updateWeekLabel(){
  const m=getMondayOf(weekOffset);
  const sun=new Date(m);sun.setDate(sun.getDate()+6);
  const f=d=>`${d.getMonth()+1}/${d.getDate()}`;
  document.getElementById("weekLabel").textContent=`${f(m)} – ${f(sun)}`;
}

// ── Language ──────────────────────────────────────────────────
window.toggleLang=function(){
  lang=lang==="ko"?"en":"ko";
  localStorage.setItem("lang",lang);
  document.getElementById("langBtn").textContent=lang==="ko"?"EN":"한";
  renderAll();updateWeekLabel();
};

// ── Tab switch ────────────────────────────────────────────────
window.switchTab=function(tab){
  activeTab=tab;
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
  ["statusContent","teamContent","myContent"].forEach(id=>{document.getElementById(id).style.display="none";});
  document.getElementById(tab+"Content").style.display="block";
  document.getElementById("weekNav").style.display=(tab==="team"||tab==="my")?"flex":"none";
  renderAll();
};

// ── Helpers ───────────────────────────────────────────────────
function getMondayOf(offset){
  const d=new Date(),day=d.getDay();
  d.setDate(d.getDate()+(day===0?-6:1-day)+offset*7);d.setHours(0,0,0,0);return d;
}
function dateKey(d){return d.toISOString().slice(0,10);}
function escHtml(s){return(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function hexAlpha(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function showToast(msg,type="ok"){
  const el=document.createElement("div");
  el.className=`toast toast-${type}`;el.textContent=msg;
  document.getElementById("toastArea").appendChild(el);
  setTimeout(()=>el.remove(),3000);
}

window.showLoginModal  = showLoginModal;
window.showMasterPanel = showMasterPanel;

// ── Boot ──────────────────────────────────────────────────────
(function boot(){
  updateWeekLabel();
  document.getElementById("langBtn").textContent=lang==="ko"?"EN":"한";
  initFirebase();
  setInterval(()=>{if(activeTab==="status")renderStatus();},60000);
  setTimeout(()=>{
    updateHeader();
    if(!myId) showLoginModal();
  },800);
})();
</script>

.pin-box{width:52px;height:60px;border:2px solid var(--border);border-radius:10px;
  text-align:center;font-size:1.6rem;font-weight:700;color:var(--text);
  outline:none;transition:border-color .15s;-webkit-appearance:none;appearance:none;}
.pin-box:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(26,115,232,.15);}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
#pinBoxes.shake{animation:shake .4s ease;}

/* ── Master panel ── */
.master-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.master-row:last-child{border-bottom:none;}
.master-name{font-weight:600;font-size:.9rem;}
.master-email{font-size:.72rem;color:var(--text2);}
.pin-status{font-size:.78rem;color:var(--text2);min-width:80px;text-align:right;}
.btn-unlock{border:1px solid #e53935;color:#e53935;border-radius:6px;
  background:none;padding:4px 10px;cursor:pointer;font-size:.8rem;white-space:nowrap;}
.btn-unlock:hover{background:#fce4ec;}

/* ── Toast ── */
#toastArea{position:fixed;bottom:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:8px;}
.toast{padding:10px 18px;border-radius:8px;font-size:.88rem;box-shadow:var(--shadow);
  animation:slideIn .25s ease;max-width:280px;}
.toast-ok{background:#202124;color:#fff;}
.toast-warn{background:#f57c00;color:#fff;}
@keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

@media(max-width:600px){
  .app-header h1{font-size:.95rem;}
  #statusContent,#teamContent,#myContent{padding:10px;}
  .team-dashboard{grid-template-columns:1fr 1fr;}
  .member-grid{grid-template-columns:1fr;}
  .pin-box{width:44px;height:52px;font-size:1.4rem;}
}
</style>
</head>
<body>

<!-- ── Header ── -->
<header class="app-header">
  <h1 id="appTitle">Team Schedule</h1>
  <span id="connStatus" style="color:#aaa;font-size:.75rem"></span>
  <button id="langBtn" onclick="toggleLang()">EN</button>
  <button id="masterBtn" onclick="showMasterPanel()">👑 관리</button>
  <button id="logoutBtn" onclick="doLogout()">로그아웃</button>
  <span id="userBadge" class="user-badge" onclick="showLoginModal()" style="background:#aaa">?</span>
</header>

<!-- ── Tabs ── -->
<nav class="tabs">
  <button class="tab-btn active" data-tab="status" onclick="switchTab('status')">실시간 현황판</button>
  <button class="tab-btn"        data-tab="team"   onclick="switchTab('team')">팀 전체 일정</button>
  <button class="tab-btn"        data-tab="my"     onclick="switchTab('my')">내 일정 입력</button>
</nav>

<!-- ── Week nav ── -->
<div class="week-nav" id="weekNav" style="display:none">
  <button onclick="prevWeek()">‹</button>
  <span id="weekLabel"></span>
  <button onclick="goToday()">●</button>
  <button onclick="nextWeek()">›</button>
</div>

<!-- ── Content ── -->
<div id="statusContent"></div>
<div id="teamContent" style="display:none"></div>
<div id="myContent"   style="display:none"></div>
<div id="toastArea"></div>

<!-- ── Login Modal ── -->
<div class="modal-overlay" id="loginModal">
  <div class="modal">
    <h2 id="loginTitle">사용자 선택</h2>
    <p class="modal-desc" id="loginDesc">이름을 선택하세요</p>

    <!-- 멤버 선택 그리드 -->
    <div class="member-grid" id="memberGrid"></div>

    <!-- PIN 입력 영역 -->
    <div id="pinArea" style="display:none">
      <div class="pin-member-info">
        <span class="mp-avatar" id="pinAvatar" style="width:40px;height:40px;font-size:1.1rem;border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0"></span>
        <div>
          <div class="name" id="pinMemberName"></div>
          <div class="email" id="pinMemberEmail"></div>
        </div>
      </div>
      <div id="pinBoxes">
        <input class="pin-box" type="number" min="0" max="9" maxlength="1"
          oninput="onPinInput(event,0)" onkeydown="onPinKeydown(event,0)"/>
        <input class="pin-box" type="number" min="0" max="9" maxlength="1"
          oninput="onPinInput(event,1)" onkeydown="onPinKeydown(event,1)"/>
        <input class="pin-box" type="number" min="0" max="9" maxlength="1"
          oninput="onPinInput(event,2)" onkeydown="onPinKeydown(event,2)"/>
        <input class="pin-box" type="number" min="0" max="9" maxlength="1"
          oninput="onPinInput(event,3)" onkeydown="onPinKeydown(event,3)"/>
      </div>
    </div>

    <div class="modal-actions" style="margin-top:16px">
      <button id="loginBackBtn" class="btn-ghost" style="display:none"
        onclick="pinStep='select';renderLoginModal()">← 뒤로</button>
    </div>
  </div>
</div>

<!-- ── Master Panel Modal ── -->
<div class="modal-overlay" id="masterModal">
  <div class="modal">
    <h2>👑 관리자 패널</h2>
    <p class="modal-desc">PIN 설정 현황을 확인하고 초기화할 수 있습니다.</p>
    <div id="masterPanelBody"></div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeMasterPanel()">닫기</button>
    </div>
  </div>
</div>

<!-- ── Excel Download Modal ── -->
<div class="modal-overlay" id="excelModal">
  <div class="modal" style="max-width:320px">
    <h2>📊 월별 엑셀 저장</h2>
    <p class="modal-desc">저장할 연도와 월을 선택하세요. 해당 월의 모든 주간 일정이 시트별로 저장됩니다.</p>
    <div class="form-group">
      <label>연도</label>
      <input id="excelYear" type="number" min="2024" max="2030" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:.95rem;"/>
    </div>
    <div class="form-group">
      <label>월</label>
      <select id="excelMonth" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:.95rem;background:#fff">
        <option value="1">1월</option><option value="2">2월</option><option value="3">3월</option>
        <option value="4">4월</option><option value="5">5월</option><option value="6">6월</option>
        <option value="7">7월</option><option value="8">8월</option><option value="9">9월</option>
        <option value="10">10월</option><option value="11">11월</option><option value="12">12월</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeExcelModal()">취소</button>
      <button class="btn-primary" onclick="downloadMonthExcel()">💾 저장</button>
    </div>
  </div>
</div>

<!-- ── Add Schedule Modal ── -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2>일정 추가 / Add Schedule</h2>
    <input type="hidden" id="addDk"/>
    <div class="form-group">
      <label>빠른 선택 / Quick Pick</label>
      <div class="sched-type-row">
        <button class="sched-type-btn" onclick="pickSchedType('office')">🏢 출근</button>
        <button class="sched-type-btn" onclick="pickSchedType('remote')">🏠 재택</button>
        <button class="sched-type-btn" onclick="pickSchedType('field')">🚗 외근</button>
        <button class="sched-type-btn" onclick="pickSchedType('business')">✈️ 출장</button>
        <button class="sched-type-btn" onclick="pickSchedType('vacation')">🌴 휴가</button>
      </div>
      <div class="sched-type-row" style="margin-top:6px">
        <button class="sched-type-btn" onclick="pickSchedType('training')">📚 교육</button>
        <button class="sched-type-btn" onclick="pickSchedType('seminar')">🎤 세미나</button>
        <button class="sched-type-btn" onclick="pickSchedType('refresh')">🌿 리프레시</button>
        <button class="sched-type-btn" onclick="pickSchedType('annual')">📅 연차</button>
        <button class="sched-type-btn" onclick="pickSchedType('halfAM')">🌅 오전반차</button>
        <button class="sched-type-btn" onclick="pickSchedType('halfPM')">🌇 오후반차</button>
      </div>
    </div>
    <div class="form-group">
      <label>내용 / Title</label>
      <input id="addTitle" type="text" placeholder="일정 내용" maxlength="60"
        onkeydown="if(event.key==='Enter')saveAddModal()"/>
    </div>
    <div class="form-group">
      <label>시간대 / Time Slot</label>
      <div class="slot-pick">
        <button class="slot-pick-btn" data-slot="AM" onclick="pickSlot('AM')">
          🌅 오전/Morning<small>09:00–13:00</small>
        </button>
        <button class="slot-pick-btn" data-slot="PM" onclick="pickSlot('PM')">
          🌆 오후/Afternoon<small>14:00–18:00</small>
        </button>
        <button class="slot-pick-btn active" data-slot="FULL" onclick="pickSlot('FULL')">
          ☀️ 하루/Full Day<small>09:00–18:00</small>
        </button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeAddModal()">취소</button>
      <button class="btn-primary" onclick="saveAddModal()">추가</button>
    </div>
  </div>
</div>

</body>
</html>
